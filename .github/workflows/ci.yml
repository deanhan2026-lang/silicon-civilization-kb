name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xml

      - name: Run tests
        run: |
          pytest tests/ \
            --junitxml=test_results/test-results.xml \
            --tb=short \
            -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results/*.xml
          retention-days: 30

      - name: Push test results to repo (on success)
        if: success()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add test_results/*.xml
          git diff --staged --quiet || git commit -m "ci: update test results [skip ci]"
          git push

  audit:
    name: quick audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run governance engine smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from governance.governance_engine import GovernanceEngine
          ge = GovernanceEngine()
          rules = ge.list_rules()
          print(f'Governance rules loaded: {len(rules)}')
          for r in rules:
              print(f'  - {r[\"rule_id\"]}: {r[\"title\"]}')
          assert len(rules) >= 8, 'Expected at least 8 rules (G001-G008)'
          print('PASS: governance engine')
          "
