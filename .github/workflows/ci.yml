name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set up CI environment
        run: |
          mkdir -p ~/.qclaw/workspace-agent-d9479bde/silicon-civilization-kb/
          touch ~/.qclaw/workspace-agent-d9479bde/silicon-civilization-kb/freeze.flag

      - name: Run tests (skip infra-dependent tests)
        run: |
          pytest tests/ \
            --junitxml=test_results/test-results.xml \
            --tb=short \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_api.py \
            --ignore=tests/test_memguard.py \
            --ignore=tests/test_memguard_full.py \
            -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test_results/*.xml
          retention-days: 30

  audit:
    name: quick audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run governance engine smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(0, 'scripts')
          from governance_engine import GovernanceEngine
          ge = GovernanceEngine()
          rules = ge.load_rules()
          print(f'Governance rules loaded: {len(rules)}')
          for rid, rule in rules.items():
              print(f'  - {rid}: {rule.name}')
          # CI has no NAS, expect 0 rules in this environment
          print('PASS: governance engine (CI mode, no NAS mount)')
          "
