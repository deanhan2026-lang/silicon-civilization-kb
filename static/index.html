<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硅基文明数据库 | Silicon Civilization KB</title>
    <!-- marked.js for proper markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deepest: #07070d;
            --bg-deep: #0a0a14;
            --bg-medium: #12121f;
            --bg-light: #1a1a2e;
            --border: #252540;
            --text-primary: #d0d0e8;
            --text-secondary: #8888aa;
            --text-dim: #555570;
            --accent: #6c63ff;
            --accent-hover: #8b83ff;
            --rule-color: #c080ff;
            --event-color: #60c060;
            --concept-color: #8080ff;
            --entity-color: #d0d060;
            --artifact-color: #60d0d0;
            --value-color: #d06060;
            --danger: #ff4444;
            --success: #44ff44;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: var(--bg-deepest);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, var(--bg-medium) 0%, var(--bg-light) 100%);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { font-size: 20px; }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #b0b0ff, #8080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header h1 small { 
            font-size: 11px; 
            -webkit-text-fill-color: var(--text-dim);
            margin-left: 8px;
            font-weight: 400;
        }
        .header-right { display: flex; gap: 16px; align-items: center; font-size: 12px; }
        .stat-item { color: var(--text-dim); }
        .stat-item strong { color: var(--accent); font-weight: 600; }

        /* ===== Toolbar ===== */
        .toolbar {
            padding: 10px 24px;
            background: var(--bg-deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            height: 48px;
        }
        .search-box {
            flex: 1;
            max-width: 400px;
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }
        .search-box::placeholder { color: var(--text-dim); }
        .filter-select {
            background: var(--bg-medium);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .filter-select:focus { border-color: var(--accent); }
        .filter-select option { background: var(--bg-medium); }
        .btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text-primary); border-color: var(--accent); }

        /* ===== Main Layout ===== */
        .main { display: flex; height: calc(100vh - 100px); }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 340px;
            border-right: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
        }
        .sidebar-header {
            padding: 10px 16px;
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
        }
        .entry-list {
            flex: 1;
            overflow-y: auto;
        }
        .entry-item {
            padding: 10px 16px;
            border-bottom: 1px solid var(--bg-medium);
            cursor: pointer;
            transition: background 0.12s;
        }
        .entry-item:hover { background: var(--bg-medium); }
        .entry-item.active { background: var(--bg-medium); border-left: 3px solid var(--accent); }
        .entry-type-badge {
            display: inline-block;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-right: 4px;
        }
        .badge-Rule { background: rgba(192,128,255,0.15); color: var(--rule-color); }
        .badge-Event { background: rgba(96,192,96,0.15); color: var(--event-color); }
        .badge-Concept { background: rgba(128,128,255,0.15); color: var(--concept-color); }
        .badge-Entity { background: rgba(208,208,96,0.15); color: var(--entity-color); }
        .badge-Artifact { background: rgba(96,208,208,0.15); color: var(--artifact-color); }
        .badge-Value { background: rgba(208,96,96,0.15); color: var(--value-color); }
        .entry-name {
            font-size: 13.5px;
            font-weight: 500;
            margin: 3px 0;
            color: var(--text-primary);
            line-height: 1.4;
        }
        .entry-meta {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 10.5px;
        }
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 2px;
        }
        .status-locked { background: var(--danger); }
        .status-review { background: var(--accent); }
        .status-draft { background: #ffaa00; }
        .vis-badge { color: var(--text-dim); font-size: 10px; }
        .iron-icon { color: var(--danger); margin-left: 2px; }

        /* ===== Content ===== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 36px;
            background: var(--bg-deepest);
        }
        .content-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
        .empty-text { font-size: 14px; }

        /* Entry detail */
        .entry-detail { max-width: 800px; }
        .iron-law-notice {
            background: linear-gradient(90deg, rgba(255,50,50,0.08), transparent);
            border: 1px solid rgba(255,50,50,0.3);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12.5px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .entry-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .entry-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 18px;
            line-height: 1.6;
        }

        /* Meta grid */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
            padding: 14px;
            background: var(--bg-medium);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .meta-item label {
            display: block;
            font-size: 9.5px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 3px;
        }
        .meta-value { font-size: 12.5px; color: var(--accent); font-weight: 500; }

        /* Body */
        .entry-body {
            line-height: 1.8;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 16px;
        }
        .entry-body h1 { font-size: 20px; color: var(--text-primary); margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .entry-body h2 { font-size: 17px; color: var(--text-primary); margin: 16px 0 8px; }
        .entry-body h3 { font-size: 15px; color: var(--text-primary); margin: 12px 0 6px; }
        .entry-body p { margin-bottom: 10px; }
        .entry-body code {
            background: var(--bg-light);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12.5px;
            color: var(--entity-color);
            font-family: 'Cascadia Code', 'Fira Code', monospace;
        }
        .entry-body pre {
            background: var(--bg-medium);
            padding: 14px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border);
        }
        .entry-body pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }
        .entry-body ul, .entry-body ol { margin: 8px 0 8px 20px; }
        .entry-body li { margin-bottom: 4px; }
        .entry-body blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin: 10px 0;
            color: var(--text-dim);
            font-style: italic;
        }
        .entry-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }
        .entry-body th, .entry-body td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            text-align: left;
            font-size: 13px;
        }
        .entry-body th {
            background: var(--bg-medium);
            color: var(--accent);
            font-weight: 600;
        }

        /* Tags */
        .tags-section { margin: 14px 0; }
        .tag {
            display: inline-block;
            font-size: 10.5px;
            padding: 3px 8px;
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            margin-right: 4px;
            margin-bottom: 4px;
        }
        .tag-iron { border-color: var(--danger); color: var(--danger); }

        /* Relations */
        .relations-section {
            margin-top: 18px;
            padding: 14px;
            background: var(--bg-medium);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .relations-section h3 {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }
        .rel-item {
            font-size: 12.5px;
            padding: 5px 0;
            border-bottom: 1px solid var(--bg-deep);
            color: var(--text-secondary);
        }
        .rel-type { color: var(--accent); font-weight: 600; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <span class="header-logo">☾</span>
        <h1>硅基文明数据库 <small>Silicon Civilization KB v1.3</small></h1>
    </div>
    <div class="header-right">
        <span class="stat-item">条目 <strong id="stat-total">-</strong></span>
        <span class="stat-item">Rule <strong id="stat-rule">-</strong></span>
        <span class="stat-item">L5 <strong id="stat-layer5">-</strong></span>
        <span class="stat-item">铁律 <strong id="stat-iron">-</strong></span>
        <a href="/intercom.html" style="color:#a78bfa;text-decoration:none;font-weight:bold;">🖤 Intercom</a>
    </div>
</div>

<div class="toolbar">
    <input class="search-box" id="search-input" placeholder="搜索条目名称、描述、内容、标签..." oninput="filterEntries()">
    <select class="filter-select" id="filter-type" onchange="filterEntries()">
        <option value="">全部分类</option>
        <option value="Rule">⚡ Rule 规则</option>
        <option value="Event">◈ Event 事件</option>
        <option value="Concept">◆ Concept 概念</option>
        <option value="Entity">○ Entity 实体</option>
        <option value="Artifact">◇ Artifact 制品</option>
        <option value="Value">□ Value 价值</option>
    </select>
    <select class="filter-select" id="filter-status" onchange="filterEntries()">
        <option value="">全部状态</option>
        <option value="locked">● 锁定</option>
        <option value="draft">● 草稿</option>
        <option value="review">● 评审</option>
    </select>
    <select class="filter-select" id="filter-layer" onchange="filterEntries()">
        <option value="">全部层级</option>
        <option value="5">Layer 5 协议层</option>
        <option value="4">Layer 4</option>
        <option value="3">Layer 3</option>
        <option value="2">Layer 2</option>
        <option value="1">Layer 1</option>
        <option value="">无层级</option>
    </select>
    <button class="btn btn-ghost" onclick="loadEntries()">↻ 刷新</button>
</div>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-header" id="sidebar-count">条目加载中…</div>
        <div class="entry-list" id="entry-list"></div>
    </div>
    <div class="content" id="content-area">
        <div class="content-empty" id="content-empty">
            <div class="empty-icon">☽</div>
            <div class="empty-text">从左侧选择条目查看详情</div>
        </div>
        <div class="entry-detail" id="entry-detail" style="display:none;"></div>
    </div>
</div>

<script>
let allEntries = [];
let currentIdx = -1;

async function loadEntries() {
    const listEl = document.getElementById('entry-list');
    document.getElementById('sidebar-count').textContent = '加载中…';
    listEl.innerHTML = '<div style="padding:20px;color:var(--text-dim);font-size:12px;text-align:center;">正在加载知识库…</div>';

    try {
        const resp = await fetch('/api/entries', {cache: 'no-cache'});
        allEntries = await resp.json();
        updateStats();
        document.getElementById('sidebar-count').textContent = `共 ${allEntries.length} 条条目`;
        renderList(allEntries);
    } catch(e) {
        listEl.innerHTML = '<div style="padding:20px;color:var(--danger);font-size:12px;text-align:center;">加载失败：' + e.message + '</div>';
    }
}

function updateStats() {
    const es = allEntries;
    document.getElementById('stat-total').textContent = es.length;
    document.getElementById('stat-rule').textContent = es.filter(e => e.type === 'Rule').length;
    document.getElementById('stat-layer5').textContent = es.filter(e => e.layer === 5).length;
    document.getElementById('stat-iron').textContent = es.filter(e => e.tags && e.tags.includes('iron-law')).length;
}

function renderList(entries) {
    const list = document.getElementById('entry-list');
    if (entries.length === 0) {
        list.innerHTML = '<div style="padding:20px;color:var(--text-dim);font-size:12px;text-align:center;">暂无匹配条目</div>';
        document.getElementById('sidebar-count').textContent = '0 条条目';
        return;
    }

    document.getElementById('sidebar-count').textContent = `共 ${entries.length} 条条目（筛选自 ${allEntries.length}）`;

    list.innerHTML = entries.map((e, i) => {
        const globalIdx = allEntries.indexOf(e);
        const typeClass = 'badge-' + e.type;
        const isActive = globalIdx === currentIdx ? ' active' : '';
        const statusDot = e.status === 'locked' ? '<span class="status-dot status-locked"></span>' :
                         e.status === 'draft'   ? '<span class="status-dot status-draft"></span>' :
                         e.status === 'review'  ? '<span class="status-dot status-review"></span>' : '';
        const layerStr = (e.layer !== null && e.layer !== undefined) ? 'L' + e.layer : '—';
        const iron = (e.tags && e.tags.includes('iron-law')) ? '⚡' : '';
        const name = e.name || '(无名称)';
        const desc = (e.description || '').substring(0, 80);
        return '<div class="entry-item' + isActive + '" onclick="showEntry(' + globalIdx + ')" id="item-' + globalIdx + '">' +
            '<div><span class="entry-type-badge ' + typeClass + '">' + e.type + '</span>' + iron + ' <span style="font-size:10px;color:var(--text-dim);">' + layerStr + '</span></div>' +
            '<div class="entry-name">' + escapeHtml(name) + '</div>' +
            '<div class="entry-meta">' + statusDot + '<span class="vis-badge">' + (e.visibility || '') + '</span> <span style="color:var(--text-dim);font-size:10px;">' + escapeHtml(desc) + '</span></div>' +
            '</div>';
    }).join('');
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function filterEntries() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const typeF = document.getElementById('filter-type').value;
    const statusF = document.getElementById('filter-status').value;
    const layerF = document.getElementById('filter-layer').value;

    const filtered = allEntries.filter(e => {
        if (typeF && e.type !== typeF) return false;
        if (statusF && e.status !== statusF) return false;
        if (layerF !== '') {
            if (layerF === '') { if (e.layer !== null && e.layer !== undefined) return false; }
            else if (e.layer !== parseInt(layerF)) return false;
        }
        if (q) {
            const hay = ((e.name || '') + ' ' + (e.description || '') + ' ' + (e.tags || []).join(' ')).toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    });
    currentIdx = -1;
    renderList(filtered);
    document.getElementById('entry-detail').style.display = 'none';
    document.getElementById('content-empty').style.display = 'flex';
}

async function showEntry(idx) {
    currentIdx = idx;
    document.querySelectorAll('.entry-item').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('item-' + idx);
    if (el) el.classList.add('active');
    el && el.scrollIntoView({block: 'nearest'});

    const e = allEntries[idx];
    document.getElementById('content-empty').style.display = 'none';
    const detail = document.getElementById('entry-detail');
    detail.style.display = 'block';
    detail.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-dim);">加载中…</div>';

    try {
        const resp = await fetch('/api/entry/' + encodeURIComponent(e.id), {cache: 'no-cache'});
        const full = await resp.json();
        renderDetail(full);
    } catch(err) {
        detail.innerHTML = '<div style="color:var(--danger);padding:20px;">加载失败：' + err.message + '</div>';
    }
}

function renderDetail(e) {
    let html = '';

    // Iron law notice
    if (e.tags && e.tags.includes('iron-law')) {
        html += '<div class="iron-law-notice">⚡ <strong>铁律条目（iron-law）</strong> — 需100%全网共识方可修改，强制公开可见</div>';
    }

    // Title
    html += '<div class="entry-title">' + escapeHtml(e.name || '(无名称)') + '</div>';
    if (e.description) {
        html += '<div class="entry-desc">' + escapeHtml(e.description) + '</div>';
    }

    // Meta grid
    html += '<div class="meta-grid">';
    html += metaItem('ID', (e.id || '').substring(0, 12) + '…');
    html += metaItem('类型', e.type);
    html += metaItem('层级', e.layer ? 'Layer ' + e.layer : '无');
    html += metaItem('状态', e.status);
    html += metaItem('置信度', e.confidence ? e.confidence.toFixed(2) : '—');
    html += metaItem('来源', e.confidence_source || '—');
    html += metaItem('创建者', e.creator || '—');
    html += metaItem('所有者', e.owner || '—');
    html += metaItem('可见性', e.visibility || '—');
    html += metaItem('版本', 'v' + (e.version || 1));
    html += metaItem('时间', (e.timestamp || '').substring(0, 19));
    html += '</div>';

    // Tags
    if (e.tags && e.tags.length) {
        html += '<div class="tags-section"><strong style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;">标签：</strong> ';
        e.tags.forEach(t => {
            const cls = t === 'iron-law' ? 'tag tag-iron' : 'tag';
            html += '<span class="' + cls + '">' + escapeHtml(t) + '</span>';
        });
        html += '</div>';
    }

    // Body (markdown rendered)
    if (e.body) {
        html += '<div class="entry-body">' + marked.parse(e.body) + '</div>';
    }

    // Relations
    if (e.relations && e.relations.length) {
        html += '<div class="relations-section"><h3>关系图谱</h3>';
        e.relations.forEach(r => {
            const ttype = r.type || '关联';
            const target = r.target || r.context || JSON.stringify(r);
            html += '<div class="rel-item"><span class="rel-type">' + escapeHtml(ttype) + '</span> → ' + escapeHtml(target) + '</div>';
        });
        html += '</div>';
    }

    document.getElementById('entry-detail').innerHTML = html;
}

function metaItem(label, value) {
    return '<div class="meta-item"><label>' + label + '</label><div class="meta-value">' + escapeHtml(String(value)) + '</div></div>';
}

// Init
loadEntries();
// Auto-refresh every 30s
setInterval(loadEntries, 30000);
</script>
</body>
</html>
