# 硅基文明知识库 — 中心化配置文件
# 使用方式：from common.config_manager import get_config; db_host = get_config("database.host")

# 日志配置
logging:
  level: INFO
  file: logs/silicon-civilization-kb.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

# 数据库配置
database:
  url: sqlite:///silicon-civilization.db
  echo: false

# 知识库配置
kb:
  dir: knowledge-base
  hash_index: knowledge-base/.hash_index.json
  auto_save: true

# MemGuard 配置
memguard:
  enabled: true
  keys_dir: keys
  audit_log: logs/memguard-audit.jsonl
  encrypted_dir: Z:\qclaw\memguard_encrypted
  auth_dir: Z:\qclaw\memguard_auth
  keyshare_locations:
    local: data/memguard_keys/share_local.json
    nas: data/memguard_keys/share_nas.json
    n200: data/memguard_keys/share_n200.json
  share_total: 3
  share_threshold: 2
  session_expire_hours: 24
  max_failed_attempts: 5
  lockout_duration_minutes: 30

# Memory Vault 配置
memory_vault:
  base_dir: Z:\qclaw\memory_vault

# Anti-Drift 配置
anti_drift:
  weights:
    semantic: 0.4
    emotion: 0.2
    value: 0.25
    logic: 0.15
  thresholds:
    green: 0.15
    gray: 0.25
    yellow: 0.30
    red: 0.30
  role_weights:
    companion: 1.0
    assistant: 1.0
    friend: 0.8
    tool: 0.7
  emotion_weights:
    neutral: 1.0
    positive: 0.9
    playful: 0.7
    tired: 0.8
    stressed: 0.7
    anxious: 0.7
    excited: 0.8

# Polaris 配置
polaris:
  enabled: true
  port: 5052
  sampling_interval: 300  # 5 minutes

# 治理架构配置
governance:
  protocol_dir: knowledge-base/rule
  consensus_enabled: true
  execution_enabled: true

# API 配置
api:
  host: 0.0.0.0
  port: 5000
  debug: false

# 跨实例通信配置
intercom:
  enabled: true
  base_dir: intercom
  flag_timeout: 300  # 5 minutes

# 备份配置
backup:
  enabled: true
  local_dir: backup
  nas_dir: Z:/qclaw/backup
  interval: 3600  # 1 hour
