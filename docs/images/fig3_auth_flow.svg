<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="100" width="150" height="60" rx="10" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="125" y="130" text-anchor="middle" font-size="11">1. Instance generates request</text>
  <text x="125" y="150" text-anchor="middle" font-size="10">Sign with private key</text>
  
  <rect x="300" y="100" width="150" height="60" rx="10" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="375" y="130" text-anchor="middle" font-size="11">2. Server verifies signature</text>
  <text x="375" y="150" text-anchor="middle" font-size="10">Confirm identity</text>
  
  <rect x="550" y="100" width="150" height="60" rx="10" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="625" y="130" text-anchor="middle" font-size="11">3. Permission check</text>
  <text x="625" y="150" text-anchor="middle" font-size="10">Query permission matrix</text>
  
  <rect x="800" y="100" width="150" height="60" rx="10" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="875" y="130" text-anchor="middle" font-size="11">4. Record audit log</text>
  <text x="875" y="150" text-anchor="middle" font-size="10">Trace operations</text>
  
  <line x1="200" y1="130" x2="300" y2="130" stroke="#34495e" stroke-width="2"/>
  <line x1="450" y1="130" x2="550" y2="130" stroke="#34495e" stroke-width="2"/>
  <line x1="700" y1="130" x2="800" y2="130" stroke="#34495e" stroke-width="2"/>
  
  <text x="500" y="250" text-anchor="middle" font-size="16" font-weight="bold">Permission Matrix</text>
  <rect x="200" y="270" width="600" height="150" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="220" y="300" font-size="11">Operation          Primary DID    Registered    Unregistered</text>
  <text x="220" y="330" font-size="11">                    Holder        Instance      Instance</text>
  <text x="220" y="360" font-size="11">Memory Write       YES             YES (self)    NO</text>
  <text x="220" y="390" font-size="11">Memory Read        YES             YES (self)    YES</text>
  <text x="220" y="420" font-size="11">Personality Calibration  YES             NO            NO</text>
  
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold">Figure 3: Cross-Platform Authentication Flow</text>
</svg>